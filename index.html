<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  #wrapper {
    position: relative;
    width: 360px;
    height: 640px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255,220,80,0.18), 0 0 0 3px #f7c948;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #score {
    margin-top: 28px;
    font-size: 36px;
    color: #fff;
    text-shadow: 2px 2px 0 #b8650a, -1px -1px 0 #b8650a;
    letter-spacing: 2px;
    transition: transform 0.08s;
  }

  #score.pop { transform: scale(1.3); }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20,14,40,0.72);
    pointer-events: all;
    cursor: pointer;
    gap: 18px;
  }

  #overlay.hidden { display: none; }

  #overlay h1 {
    font-size: 22px;
    color: #f7c948;
    text-shadow: 2px 3px 0 #b8650a;
    text-align: center;
    line-height: 1.7;
  }

  #overlay .sub {
    font-size: 9px;
    color: #c8f0ff;
    text-align: center;
    line-height: 2;
    opacity: 0.85;
  }

  .scoreboard {
    background: rgba(255,255,255,0.08);
    border: 2px solid #f7c948;
    border-radius: 8px;
    padding: 14px 30px;
    text-align: center;
  }
  .scoreboard .label { font-size: 8px; color: #aaa; margin-bottom: 6px; }
  .scoreboard .val { font-size: 20px; color: #fff; }
  .scoreboard .best-label { font-size: 7px; color: #f7c948; margin-top: 10px; }
  .scoreboard .best-val { font-size: 14px; color: #f7c948; }

  #btn {
    margin-top: 6px;
    padding: 12px 28px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    background: #f7c948;
    color: #2a1200;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 4px 0 #b8650a;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  #btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8650a; }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="ui">
    <div id="score">0</div>
  </div>
  <div id="overlay">
    <h1>FLAPPY<br>BIRD</h1>
    <div class="sub">tap or press space<br>to flap your wings</div>
    <button id="btn">PLAY</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 360, H = 640;
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const btn = document.getElementById('btn');

// ── Palette ──────────────────────────────────────────
const C = {
  sky1: '#70c5ce', sky2: '#c9eeff',
  ground: '#ded895', groundDark: '#bdb06d',
  pipe: '#74bf2e', pipeDark: '#5a9922', pipeLight: '#a2e05a',
  bird: '#f7c948', birdDark: '#e0a020', birdEye: '#fff', birdPupil: '#222',
  wing: '#f0b030',
};

// ── State ─────────────────────────────────────────────
let bird, pipes, score, best, state, lastTime, flapPressed, particles;

function reset() {
  bird = { x: 80, y: H / 2, vy: 0, angle: 0, wingAngle: 0, wingDir: 1 };
  pipes = [];
  particles = [];
  score = 0;
  state = 'idle'; // idle | playing | dead
  scoreEl.textContent = '0';
  flapPressed = false;
  lastTime = null;
  if (best === undefined) best = 0;
}

// ── Physics constants ──────────────────────────────────
const GRAVITY = 0.38;
const FLAP = -7.2;
const PIPE_W = 52;
const GAP = 160;
const PIPE_SPEED = 2.4;
const GROUND_H = 80;
const BIRD_R = 16;

// ── Pipe generation ────────────────────────────────────
let pipeTimer = 0;
function spawnPipe() {
  const minTop = 80, maxTop = H - GROUND_H - GAP - 80;
  const topH = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({ x: W + 10, topH, scored: false });
}

// ── Input ──────────────────────────────────────────────
function flap() {
  if (state === 'dead') return;
  if (state === 'idle') {
    state = 'playing';
    overlay.classList.add('hidden');
  }
  bird.vy = FLAP;
  spawnParticles(bird.x, bird.y, '#fff', 6);
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
canvas.addEventListener('pointerdown', flap);
btn.addEventListener('click', e => { e.stopPropagation(); start(); });

function start() {
  reset();
  overlay.classList.add('hidden');
  state = 'idle';
  requestAnimationFrame(loop);
}

// ── Particles ──────────────────────────────────────────
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 1, color });
  }
}

// ── Collision ──────────────────────────────────────────
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

// ── Background clouds ──────────────────────────────────
const clouds = Array.from({ length: 5 }, (_, i) => ({
  x: i * 90 + 20, y: 60 + Math.random() * 80, w: 60 + Math.random() * 40, speed: 0.25 + Math.random() * 0.2
}));

// ── Draw helpers ───────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  g.addColorStop(0, '#56b4e0');
  g.addColorStop(1, '#b8e8f8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const h = w * 0.5;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, h * 0.4, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.22, y + h * 0.1, w * 0.3, h * 0.3, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.22, y + h * 0.1, w * 0.3, h * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(p) {
  const capH = 20, capW = PIPE_W + 10;
  // Top pipe
  ctx.fillStyle = C.pipe;
  ctx.fillRect(p.x, 0, PIPE_W, p.topH - capH);
  // Top cap
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(p.x - 5, p.topH - capH, capW, capH);
  // Highlight
  ctx.fillStyle = C.pipeLight;
  ctx.fillRect(p.x + 4, 0, 6, p.topH - capH);

  // Bottom pipe
  const botY = p.topH + GAP;
  const botH = H - GROUND_H - botY;
  ctx.fillStyle = C.pipe;
  ctx.fillRect(p.x, botY + capH, PIPE_W, botH - capH);
  // Bottom cap
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(p.x - 5, botY, capW, capH);
  // Highlight
  ctx.fillStyle = C.pipeLight;
  ctx.fillRect(p.x + 4, botY + capH, 6, botH - capH);
}

function drawGround(offset) {
  const gy = H - GROUND_H;
  ctx.fillStyle = C.groundDark;
  ctx.fillRect(0, gy, W, GROUND_H);
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, gy, W, 18);
  // Scrolling tiles
  ctx.fillStyle = '#c9b86a';
  const tileW = 40;
  const off = offset % tileW;
  for (let x = -off; x < W; x += tileW) {
    ctx.fillRect(x, gy + 2, 18, 4);
  }
}

function drawBird(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);

  // Body
  ctx.fillStyle = C.bird;
  ctx.beginPath();
  ctx.ellipse(0, 0, BIRD_R, BIRD_R - 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  ctx.fillStyle = C.wing;
  ctx.beginPath();
  const wa = b.wingAngle;
  ctx.ellipse(-4, 3, 10, 6, wa * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = '#faeabb';
  ctx.beginPath();
  ctx.ellipse(3, 3, 7, 6, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#e87020';
  ctx.beginPath();
  ctx.moveTo(14, -1);
  ctx.lineTo(20, 2);
  ctx.lineTo(14, 5);
  ctx.closePath();
  ctx.fill();

  // Eye white
  ctx.fillStyle = C.birdEye;
  ctx.beginPath();
  ctx.arc(8, -5, 5, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = C.birdPupil;
  ctx.beginPath();
  ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(10, -6, 1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── Game Over overlay build ────────────────────────────
function showGameOver() {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>GAME<br>OVER</h1>
    <div class="scoreboard">
      <div class="label">SCORE</div>
      <div class="val">${score}</div>
      <div class="best-label">BEST</div>
      <div class="best-val">${best}</div>
    </div>
    <button id="btn">PLAY AGAIN</button>
  `;
  document.getElementById('btn').addEventListener('click', e => { e.stopPropagation(); start(); });
}

// ── Main Loop ──────────────────────────────────────────
let groundOffset = 0;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 16.667, 3); // normalize to 60fps
  lastTime = ts;

  // ── Update ──
  if (state === 'playing') {
    // Bird physics
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.angle = Math.max(-0.4, Math.min(Math.PI / 2, bird.vy * 0.06));

    // Wing flap animation
    bird.wingAngle += bird.wingDir * 0.22 * dt;
    if (bird.wingAngle > 0.6 || bird.wingAngle < -0.6) bird.wingDir *= -1;

    // Ground scroll
    groundOffset += PIPE_SPEED * dt;

    // Pipe timer
    pipeTimer += dt;
    if (pipeTimer > 88) { spawnPipe(); pipeTimer = 0; }

    // Move pipes + scoring
    for (let i = pipes.length - 1; i >= 0; i--) {
      pipes[i].x -= PIPE_SPEED * dt;
      if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
        pipes[i].scored = true;
        score++;
        if (score > best) best = score;
        scoreEl.textContent = score;
        scoreEl.classList.remove('pop');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('pop');
      }
      if (pipes[i].x + PIPE_W < -20) pipes.splice(i, 1);
    }

    // Collision: ground/ceiling
    if (bird.y + BIRD_R > H - GROUND_H || bird.y - BIRD_R < 0) {
      die();
    }

    // Collision: pipes
    for (const p of pipes) {
      if (
        circleRect(bird.x, bird.y, BIRD_R - 3, p.x - 5, 0, PIPE_W + 10, p.topH) ||
        circleRect(bird.x, bird.y, BIRD_R - 3, p.x - 5, p.topH + GAP, PIPE_W + 10, H - GROUND_H - p.topH - GAP)
      ) {
        die();
        break;
      }
    }
  } else if (state === 'idle') {
    // Gentle bob
    bird.y = H / 2 + Math.sin(ts * 0.002) * 8;
    bird.wingAngle += bird.wingDir * 0.15 * dt;
    if (bird.wingAngle > 0.6 || bird.wingAngle < -0.6) bird.wingDir *= -1;
    groundOffset += PIPE_SPEED * 0.5 * dt;
  }

  // Move clouds
  clouds.forEach(cl => { cl.x -= cl.speed * dt; if (cl.x + cl.w < 0) cl.x = W + cl.w; });

  // Particles
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.1 * dt; p.life -= 0.035 * dt; });
  particles = particles.filter(p => p.life > 0);

  // ── Draw ──
  drawSky();
  clouds.forEach(cl => drawCloud(cl.x, cl.y, cl.w));
  pipes.forEach(drawPipe);
  drawGround(groundOffset);
  drawBird(bird);
  drawParticles();

  if (state !== 'dead') requestAnimationFrame(loop);
}

function die() {
  state = 'dead';
  spawnParticles(bird.x, bird.y, C.bird, 14);
  spawnParticles(bird.x, bird.y, '#fff', 8);
  // brief death flash then show overlay
  setTimeout(showGameOver, 700);
  // death animation: keep drawing particles
  let deadFrames = 0;
  function deadLoop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 16.667, 3);
    lastTime = ts;
    bird.vy += GRAVITY * 1.4 * dt;
    bird.y += bird.vy * dt;
    bird.angle = Math.PI / 2;
    clouds.forEach(cl => { cl.x -= cl.speed * dt; if (cl.x + cl.w < 0) cl.x = W + cl.w; });
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.12 * dt; p.life -= 0.04 * dt; });
    particles = particles.filter(p => p.life > 0);
    drawSky();
    clouds.forEach(cl => drawCloud(cl.x, cl.y, cl.w));
    pipes.forEach(drawPipe);
    drawGround(groundOffset);
    if (bird.y < H) drawBird(bird);
    drawParticles();
    if (++deadFrames < 42) requestAnimationFrame(deadLoop);
  }
  requestAnimationFrame(deadLoop);
}

// ── Boot ──────────────────────────────────────────────
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
